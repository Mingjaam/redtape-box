# Windows(.exe) 와 macOS(.dmg) 설치 파일을 만든다.
# - main 에 push / PR: 빌드가 깨지지 않는지 확인하고 결과물을 Actions 아티팩트로 남김
# - v* 태그 push: 빌드 후 같은 이름의 GitHub Release 에 설치 파일을 첨부
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check
        shell: bash
        run: for f in main.js preload.js src/*.js scripts/*.js; do node --check "$f"; done

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          # Windows 코드 서명 인증서는 아직 없음
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # macOS: 저장소 Secrets 에 Developer ID 인증서가 있으면 서명 + Apple 공증,
      # 없으면(또는 PR 빌드면) ad-hoc 서명으로 만든다.
      #   MAC_CERT_P12_BASE64  Developer ID Application 인증서(.p12)를 base64 로
      #   MAC_CERT_PASSWORD    그 .p12 비밀번호
      #   APPLE_API_KEY_P8     App Store Connect API 키(.p8) 내용
      #   APPLE_API_KEY_ID     그 키의 Key ID
      #   APPLE_API_ISSUER     Issuer ID
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN: ${{ github.event_name != 'pull_request' && secrets.MAC_CERT_P12_BASE64 != '' }}
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ "$SIGN" = "true" ]; then
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            else
              echo "::warning::APPLE_API_KEY_* 가 없어 서명만 하고 공증은 건너뜁니다"
              unset APPLE_API_KEY_ID APPLE_API_ISSUER
            fi
            if ! node scripts/dist-mac.js; then
              # 릴리스(태그) 빌드는 공증 없이 내보내지 않는다
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then exit 1; fi
              echo "::warning::서명/공증 실패 — 서명만 된 빌드로 다시 만듭니다 (Apple 개발자 약관 동의 여부 확인)"
              unset APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
              rm -rf dist
              node scripts/dist-mac.js
            fi
          else
            echo "::warning::Developer ID 인증서가 없어 ad-hoc 서명으로 빌드합니다 (첫 실행 시 Gatekeeper 경고)"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false node scripts/dist-mac.js --adhoc
          fi

      # 앱(.app)은 electron-builder 가 공증·스테이플함. 설치용 dmg 도 공증 받아 티켓을 붙인다.
      - name: Notarize DMG
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG=dist/RedTape-mac.dmg
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "공증 키 없음 — 건너뜀"; exit 0; fi
          # dmg 는 electron-builder 가 서명함 (build.dmg.sign). Authority 줄은 verbose=2 에서만 나온다
          AUTH=$(codesign -d --verbose=2 "$DMG" 2>&1 | grep "^Authority=Developer ID Application" || true)
          if [ -z "$AUTH" ]; then echo "dmg 가 Developer ID 로 서명되지 않음 (ad-hoc 빌드) — 건너뜀"; exit 0; fi
          echo "$AUTH"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple "$DMG"

      - name: Check macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/mac-universal/Red Tape.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp" || true
          spctl -a -vv -t exec "$APP" 2>&1 || echo "::notice::Gatekeeper 미승인 (ad-hoc 빌드면 정상)"
          xcrun stapler validate dist/*.dmg 2>&1 || echo "::notice::공증 티켓 없음 (ad-hoc 빌드면 정상)"

      - uses: actions/upload-artifact@v4
        with:
          name: redtape-box-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Attach installers to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la out
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
